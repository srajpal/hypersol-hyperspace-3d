<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trail Shoes · Field Notes shop</title>
    <!-- A made-up shop page for milestone 28's screenshots (MILESTONE=m28 pnpm screenshots): two 3D shoes and three
         pictures to lift into the room. The shoe is the sneaker store's (tests/fixtures/holoml/sneaker-store/models,
         "Materials Variants Shoe" © 2021 Shopify, Inc., CC BY 4.0; its CREDITS.md has the changes); the pictures are
         the README sample page's. Nothing here is a real shop. -->
    <style>
      body { margin: 0; background: #f5f1ea; color: #1f2a2e; font: 17px/1.5 system-ui, "Segoe UI", sans-serif; }
      .bar { display: flex; align-items: center; gap: 28px; padding: 18px 48px; background: #1f2a2e; color: #f5f1ea; }
      .bar strong { font-size: 22px; margin-right: auto; }
      main { padding: 20px 48px; }
      h1 { margin: 0 0 14px; font-size: 34px; }
      .shoes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 20px; }
      .shoes figure { margin: 0; background: #fff; border-radius: 12px; padding: 14px; box-shadow: 0 2px 10px rgb(0 0 0 / 8%); }
      model-viewer { display: block; height: 120px; border-radius: 8px; background: linear-gradient(#efe9df, #ddd3c4); }
      figcaption { margin-top: 10px; font-weight: 600; }
      .trails { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
      .trails img { display: block; width: 100%; height: 150px; object-fit: cover; border-radius: 10px; }
    </style>
  </head>
  <body>
    <header class="bar"><strong>Field Notes shop</strong><span>Shoes</span><span>Packs</span><span>Maps</span></header>
    <main>
      <h1>Trail shoes for autumn</h1>
      <div class="shoes">
        <figure>
          <model-viewer src="/holoml/sneaker-store/models/shoe-midnight.glb" alt="Trail shoe in midnight"></model-viewer>
          <figcaption>Midnight</figcaption>
        </figure>
        <figure>
          <model-viewer src="/holoml/sneaker-store/models/shoe-ember.glb" alt="Trail shoe in ember"></model-viewer>
          <figcaption>Ember</figcaption>
        </figure>
      </div>
      <div class="trails">
        <img src="/readme/trail.svg" alt="A path winding over green hills" />
        <img src="/readme/reeds.svg" alt="Reeds and mist on a lake at dawn" />
        <img src="/readme/stars.svg" alt="A tent under a starry sky" />
      </div>
    </main>
  </body>
</html>
