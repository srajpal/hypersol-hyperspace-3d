<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lift: many pictures</title>
    <style>
      body { margin: 0; padding: 16px; background: #fff; }
      .grid { display: grid; grid-template-columns: repeat(6, 72px); gap: 12px; }
      .grid canvas { width: 72px; height: 72px; }
    </style>
  </head>
  <body>
    <!-- Milestone 28, check LT3: more pictures in view than can be lifted (12 from a page). -->
    <div class="grid" id="grid"></div>
    <script>
      const grid = document.getElementById('grid');
      for (let i = 0; i < 18; i++) {
        const c = document.createElement('canvas');
        c.width = 72;
        c.height = 72;
        c.setAttribute('aria-label', `Square ${i + 1}`);
        const g = c.getContext('2d');
        g.fillStyle = `hsl(${i * 20}, 70%, 50%)`;
        g.fillRect(0, 0, 72, 72);
        grid.append(c);
      }
    </script>
  </body>
</html>
