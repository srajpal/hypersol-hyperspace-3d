<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blocker scripts fixture</title>
  </head>
  <body>
    <p>A page the blocker's page scripts run in (GitHub issue #133).</p>
    <script>
      // What the scripts did, read once the page has loaded: two that each take a key out of what JSON.parse gives
      // (each declares the same class at its top level), the constants others set, and whether the page was given a
      // user gesture.
      window.addEventListener('load', () => {
        const constants = {};
        for (let i = 1; i <= 12; i++) constants['hs' + i] = window['hs' + i];
        window.__fixture = { parsed: JSON.parse('{"a":0,"c":1,"d":1}'), constants, activated: navigator.userActivation.hasBeenActive };
      });
    </script>
  </body>
</html>
