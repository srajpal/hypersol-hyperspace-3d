<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Blocker scripts fixture</title>
  </head>
  <body>
    <p>A page the blocker's page scripts run in (GitHub issue #133).</p>
    <script>
      // What the scripts did: two that each take a key out of what JSON.parse gives (each declares the same class at
      // its top level), and the constants others set, read first by the page's own first script, as it runs (the
      // scripts must act before any of the page's code), and again once the page has loaded; and whether the page
      // was given a user gesture.
      const read = () => {
        const constants = {};
        for (let i = 1; i <= 12; i++) constants['hs' + i] = window['hs' + i];
        return { parsed: JSON.parse('{"a":0,"c":1,"d":1}'), constants };
      };
      const atStart = read();
      window.addEventListener('load', () => {
        window.__fixture = { atStart, ...read(), activated: navigator.userActivation.hasBeenActive };
      });
    </script>
  </body>
</html>
