<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign in fixture</title>
    <style>
      body { margin: 0; padding: 40px; font-family: sans-serif; font-size: 22px; background: #fff; }
      input, button { font-size: 22px; display: block; margin: 12px 0; width: 360px; height: 44px; }
    </style>
  </head>
  <body>
    <!-- Milestone 9 checks K1 to K4: a sign-in form that stays on the page
         (the page handles the submit itself, as many sites do). Test
         values only; nothing is sent anywhere. -->
    <h1 id="state">Sign in</h1>
    <form id="login" autocomplete="on">
      <input id="user" name="user" type="text" autocomplete="username" placeholder="User name" />
      <input id="pass" name="pass" type="password" autocomplete="current-password" placeholder="Password" />
      <button id="go" type="submit">Sign in</button>
    </form>
    <script>
      // Records what the page itself sees, so the tests can tell whether
      // the fields were filled (and when).
      window.seen = [];
      for (const id of ['user', 'pass']) {
        document.getElementById(id).addEventListener('input', (e) => window.seen.push(id + '=' + e.target.value.length));
      }
      document.getElementById('login').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('state').textContent = 'Signed in';
      });
    </script>
  </body>
</html>
