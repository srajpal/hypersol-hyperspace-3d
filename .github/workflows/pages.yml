# Publishes the repository's site (site/build.mjs: the HoloML viewer for
# ordinary browsers, and the home page) to GitHub Pages from main, after
# lint, the type check, and the unit tests pass here (the end-to-end
# checks run in ci.yml on every push, and take too long to repeat). The
# promotion plan's step 4 (GitHub issue #91). Pages must be turned on for
# the repository once, under Settings, Pages, with GitHub Actions as the
# source.
#
# The actions are pinned to commits, as in ci.yml and in holoml's pages.yml.

name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'apps/browser/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: The site
        run: pnpm site:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
