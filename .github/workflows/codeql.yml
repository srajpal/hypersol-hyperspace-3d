# CodeQL code scanning, set up here rather than by GitHub's default setup
# (prompt 165): the default setup cannot build the Android app's Kotlin
# (apps/android), so its run on main ended in a configuration error once
# the app was merged. This workflow scans the same languages as before,
# the workflows themselves and the JavaScript and TypeScript, and the
# Kotlin, compiled with Gradle.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: java-kotlin
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The Kotlin compiles without the room's web build (the app's assets
      # are only needed to package it).
      - if: matrix.build-mode == 'manual'
        name: Compile the Android app's Kotlin
        working-directory: apps/android
        run: ./gradlew --no-daemon compileDebugKotlin compileDebugUnitTestKotlin

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
