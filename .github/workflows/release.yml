# The release (GitHub issue #92, the promotion plan's step 5): on a tag
# v<version>, a draft release for the tag, then a portable zip from each
# system (Windows x64, Linux x64, macOS on Apple silicon, macOS on Intel),
# made by `pnpm package` (apps/browser/scripts/package.mjs), checked by
# the smoke check (`pnpm package:smoke`: the packaged app starts, with
# its title and its room), and attached to the draft with its SHA-256.
# The owner reads the draft and publishes it (the owner, 2026-10-15, Q4).
# Nothing is signed (Q5): the notes say what Windows SmartScreen and
# macOS Gatekeeper will say. The actions are pinned to commits, as in
# ci.yml; the uploads use the repository's own token through gh.
# Each zip gets a build provenance attestation (GitHub issue #127): a
# statement, signed through GitHub's Sigstore service, that the zip was
# made by this workflow from the tag's commit; anyone can check it with
# `gh attestation verify <zip> -R srajpal/hypersol-hyperspace-3d
# --signer-workflow srajpal/hypersol-hyperspace-3d/.github/workflows/release.yml
# --source-ref refs/tags/<tag>`. It is not code signing: SmartScreen and
# Gatekeeper still ask once. An attestation names the run's own ref and
# commit, so a run started by hand must be started from the tag itself
# ("Use workflow from" the tag), and a run from any other ref stops
# before anything is drafted or built.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release (for example v0.9.2), already pushed; start the run from that tag ("Use workflow from")'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  draft:
    name: The draft release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}
      - id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          echo "tag=$tag" | tee -a "$GITHUB_OUTPUT"
      # The zips' attestations name the run's ref and commit (issue #127),
      # so the run must be the tag's own: a run by hand from main with a
      # tag typed in would build the tag and attest main.
      - name: The run is the tag's own
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "This run is on $GITHUB_REF; start it from the tag $TAG itself, so that the zips' attestations name refs/tags/$TAG." >&2
            exit 1
          fi
      # The tag names the version the checked-out package has (a dispatch
      # with a mistyped tag would otherwise draft one version with another's
      # files), and a release the owner has published is never made a draft
      # again by a run after it: the run stops instead.
      - name: The draft, with the changelog's section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="${TAG#v}"
          packaged=$(node -p "require('./apps/browser/package.json').version")
          if [ "$version" != "$packaged" ]; then
            echo "The tag $TAG names version $version, but apps/browser/package.json says $packaged." >&2
            exit 1
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "The release $TAG is already published; this run changes nothing of it." >&2
            exit 1
          fi
          {
            echo "A developer preview, as a portable zip for Windows, Linux, and macOS: unzip it and start HyperSpace3D (HyperSpace 3D.app on a Mac). Nothing is signed: Windows SmartScreen says the app is unrecognised (More info, then Run anyway), and macOS Gatekeeper refuses it until it is allowed in System Settings, Privacy & Security, or with \`xattr -dr com.apple.quarantine \"HyperSpace 3D.app\"\`. The SHA-256 of each zip is beside it, and each zip has a build provenance attestation: \`gh attestation verify <the zip> -R srajpal/hypersol-hyperspace-3d --signer-workflow srajpal/hypersol-hyperspace-3d/.github/workflows/release.yml --source-ref refs/tags/$TAG\` shows it was built by this repository's release workflow from this tag. Or build it from source: CONTRIBUTING.md."
            echo
            awk -v v="$version" '
              $0 ~ "^## " v " " { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --draft --prerelease --title "$version — developer preview" --notes-file notes.md
          else
            # --verify-tag: the tag must exist already; gh never makes one here.
            gh release create "$TAG" --verify-tag --draft --prerelease --title "$version — developer preview" --notes-file notes.md
          fi

  package:
    name: ${{ matrix.name }}
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows x64
          - os: ubuntu-latest
            name: Linux x64
          - os: macos-latest
            name: macOS on Apple silicon
          - os: macos-15-intel
            name: macOS on Intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # The upload, and the attestation (issue #127): a token for Sigstore's
    # signing certificate, and the right to record the attestation.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.draft.outputs.tag }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Package
        run: pnpm package

      - name: Prepare Linux for Electron
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Smoke check (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm package:smoke

      - name: Smoke check
        if: runner.os != 'Linux'
        run: pnpm package:smoke

      - name: Attest the zip's build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.zip

      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.draft.outputs.tag }}
        shell: bash
        run: gh release upload "$TAG" release/*.zip release/*.sha256 --clobber
