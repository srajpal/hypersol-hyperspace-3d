# Builds and tests every push and pull request on Windows and Linux
# (milestone 12, GitHub issue #5; approved by the owner, prompt 56, C a),
# except one that changes documents only (the *.md files at the top and
# the docs folder, which no check reads): its parts are skipped and "All
# checks" passes at once (owner, prompt 135).
# macOS joins with the macOS release milestone. Each system runs the
# end-to-end checks in four parts side by side, so a build takes as long
# as its longest part (two parts from milestone 21, owner, prompt 122,
# Q7 a; four from prompt 134): parts 2 to 4 are the HoloML files listed
# in vitest.e2e.config.ts, part 1 everything else, with lint, types, and
# the unit tests. HyperSpace 3D for Android (milestone 24, Q5 a) is built
# on Linux, with its unit tests; its checks on a device are run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Documents only? Then there is nothing for the parts to check. Anything
  # else changed, or a run started by hand, or a range that cannot be
  # compared (a first push, a rewritten branch): every part runs.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          code=true
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            push) range="$PUSH_BEFORE..$PUSH_AFTER" ;;
            *) range="" ;;
          esac
          if [ -n "$range" ] && files=$(git diff --name-only "$range" 2>/dev/null) && [ -n "$files" ]; then
            if ! echo "$files" | grep -qvE '^([^/]+[.]md|docs/.*)$'; then code=false; fi
            echo "$files" | head -50
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.os }} (part ${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        part: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    # The longest part (part 4 on Linux) takes about 18 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.part == 1
        run: pnpm lint

      - name: Types
        if: matrix.part == 1
        run: pnpm typecheck

      - name: Unit tests
        if: matrix.part == 1
        run: pnpm test

      # Electron's sandbox needs unprivileged user namespaces, which Ubuntu
      # restricts by default; the end-to-end checks also need a display
      # and, for the password checks, a system keychain (GNOME Keyring).
      - name: Prepare Linux for Electron
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11

      # A session bus and a throwaway keyring, unlocked with a throwaway
      # password; both disappear with the runner.
      - name: End-to-end checks (Linux)
        if: runner.os == 'Linux'
        env:
          HYPERSOL_E2E_PART: ${{ matrix.part }}
        run: |
          dbus-run-session -- bash -c '
            echo -n throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e'

      - name: End-to-end checks (Windows)
        if: runner.os == 'Windows'
        env:
          HYPERSOL_E2E_PART: ${{ matrix.part }}
        run: pnpm test:e2e

  # HyperSpace 3D for Android (milestone 24): the room's page and the
  # viewer built from the desktop's code, then the app's unit tests and its
  # debug build, with the Android SDK that GitHub's Linux machines carry.
  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: The room's page and the viewer
        run: |
          pnpm build
          pnpm --filter @hypersol/android build:web

      - name: Unit tests and the debug build
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

  # One check that stands for every part, whatever their number: passes
  # only when all of them passed, or when only documents changed and
  # they were skipped. A rule that requires checks before merging can
  # name this one and need no change when the parts do.
  all:
    name: All checks
    if: always()
    needs: [changes, test, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          TEST: ${{ needs.test.result }}
          ANDROID: ${{ needs.android.result }}
        run: |
          echo "What changed: $CHANGES (code: $CODE); the parts: $TEST; Android: $ANDROID"
          test "$CHANGES" = "success"
          if [ "$CODE" = "false" ]; then
            test "$TEST" = "skipped" && test "$ANDROID" = "skipped"
          else
            test "$TEST" = "success" && test "$ANDROID" = "success"
          fi
