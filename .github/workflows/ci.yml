# Builds and tests every push and pull request on Windows and Linux
# (milestone 12, GitHub issue #5; approved by the owner, prompt 56, C a).
# macOS joins with the macOS release milestone. Each system runs the
# end-to-end checks in two parts side by side, to stay within the time a
# job may take (milestone 21, owner, prompt 122, Q7 a): part 2 is HoloML's
# example sites from milestone 18 on (vitest.e2e.config.ts), part 1
# everything else, with lint, types, and the unit tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} (part ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        part: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: matrix.part == 1
        run: pnpm lint

      - name: Types
        if: matrix.part == 1
        run: pnpm typecheck

      - name: Unit tests
        if: matrix.part == 1
        run: pnpm test

      # Electron's sandbox needs unprivileged user namespaces, which Ubuntu
      # restricts by default; the end-to-end checks also need a display
      # and, for the password checks, a system keychain (GNOME Keyring).
      - name: Prepare Linux for Electron
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install -y xvfb gnome-keyring dbus-x11

      # A session bus and a throwaway keyring, unlocked with a throwaway
      # password; both disappear with the runner.
      - name: End-to-end checks (Linux)
        if: runner.os == 'Linux'
        env:
          HYPERSOL_E2E_PART: ${{ matrix.part }}
        run: |
          dbus-run-session -- bash -c '
            echo -n throwaway | gnome-keyring-daemon --unlock --components=secrets > /dev/null
            xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" pnpm test:e2e'

      - name: End-to-end checks (Windows)
        if: runner.os == 'Windows'
        env:
          HYPERSOL_E2E_PART: ${{ matrix.part }}
        run: pnpm test:e2e
