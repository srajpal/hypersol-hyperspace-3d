packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts. esbuild's checks its platform
# binary. Electron 44 has no install script: it downloads its binary on
# first use and verifies it against the checksums in its package.
allowBuilds:
  esbuild: true

# pnpm holds back a version published in the last few days. Electron
# 45.3.0 (2026-11-10) is taken at once: it is the newest of the 45
# line, with Chromium 156.0.8078.96 and fixes backported from Chromium
# and V8, as 45.2.0 has (rule 13, 2026-11-11; ARCHITECTURE.md section
# 3; the exception as the owner made it for 44.7.0, prompt 162, and as
# taken for 44.9.2). Remove the line with the next Electron upgrade.
minimumReleaseAgeExclude:
  - electron@45.3.0
