packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts. esbuild's checks its platform
# binary. Electron 44 has no install script: it downloads its binary on
# first use and verifies it against the checksums in its package.
allowBuilds:
  esbuild: true

# pnpm holds back a version published in the last few days. Electron
# 44.9.2 (2026-10-20) is taken at once: 44.8.0 and 44.9.0 since 44.7.2
# carry fixes backported from Chromium and V8, a fix for windows opened
# by a link not taking the opener's session and webPreferences, and one
# for setCertificateVerifyProc missing a request, and 44.9.2 is the
# line's newest (rule 13, before the 0.9.2 release; ARCHITECTURE.md
# section 3; the exception as the owner made it for 44.7.0, prompt 162).
# Remove the line with the next Electron upgrade.
minimumReleaseAgeExclude:
  - electron@44.9.2
