packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts. esbuild's checks its platform
# binary. Electron 44 has no install script: it downloads its binary on
# first use and verifies it against the checksums in its package.
allowBuilds:
  esbuild: true

# pnpm holds back a version published in the last few days. Electron
# 44.7.0 (2026-10-07) carries fixes backported from Chromium, V8, ANGLE,
# Dawn, Skia, and WebRTC, so it is taken at once (rule 13; ARCHITECTURE.md
# section 3; owner, prompt 162). Remove the line with the next Electron
# upgrade.
minimumReleaseAgeExclude:
  - electron@44.7.0
