<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Concept 3: a wireframe cube over a synthwave horizon">
  <!-- Concept 3: a wireframe cube floating over the room's neon grid and striped sun: the app's own 3D room in one mark. -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe36b"/><stop offset="0.6" stop-color="#ff8a4c"/><stop offset="1" stop-color="#ff2f92"/></linearGradient>
    <clipPath id="half"><rect x="0" y="0" width="256" height="170"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="48" fill="#07051a"/>
  <g clip-path="url(#half)">
    <circle cx="128" cy="170" r="64" fill="url(#sun)"/>
    <rect x="60" y="150" width="136" height="4" fill="#07051a"/>
    <rect x="60" y="160" width="136" height="6" fill="#07051a"/>
  </g>
  <g stroke="#b43cff" stroke-width="2" opacity="0.8">
    <line x1="16" y1="170" x2="240" y2="170"/>
    <line x1="16" y1="190" x2="240" y2="190"/>
    <line x1="16" y1="218" x2="240" y2="218"/>
    <line x1="128" y1="170" x2="128" y2="250"/>
    <line x1="100" y1="170" x2="60" y2="250"/>
    <line x1="156" y1="170" x2="196" y2="250"/>
    <line x1="72" y1="170" x2="0" y2="236"/>
    <line x1="184" y1="170" x2="256" y2="236"/>
  </g>
  <g fill="none" stroke="#39e6ff" stroke-width="4" stroke-linejoin="round">
    <polygon points="92,58 146,48 176,68 122,80"/>
    <polyline points="92,58 98,118 128,138 122,80"/>
    <polyline points="128,138 170,124 176,68"/>
  </g>
</svg>
