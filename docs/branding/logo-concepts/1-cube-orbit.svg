<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Concept 1: the tilted cube in an orbit ring">
  <!-- Concept 1: the 2001 cube, tilted the same way, lit in Nebula's cyan and magenta, with an orbit ring for "hyperspace". -->
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7ff0ff"/><stop offset="1" stop-color="#39e6ff"/></linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d7dff"/><stop offset="1" stop-color="#3b2bb8"/></linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff4fd8"/><stop offset="1" stop-color="#8a1f9e"/></linearGradient>
  </defs>
  <rect width="256" height="256" rx="48" fill="#07051a"/>
  <ellipse cx="128" cy="142" rx="104" ry="34" fill="none" stroke="#39e6ff" stroke-width="4" opacity="0.55" transform="rotate(-14 128 142)"/>
  <polygon points="72,78 150,64 196,92 118,108" fill="url(#top)"/>
  <polygon points="72,78 118,108 128,196 84,160" fill="url(#left)"/>
  <polygon points="118,108 196,92 176,168 128,196" fill="url(#right)"/>
  <polyline points="72,78 150,64 196,92 176,168 128,196 84,160 72,78 118,108 196,92" fill="none" stroke="#f1ecff" stroke-width="2" stroke-linejoin="round" opacity="0.8"/>
  <line x1="118" y1="108" x2="128" y2="196" stroke="#f1ecff" stroke-width="2" opacity="0.8"/>
  <path d="M 24 150 A 104 34 -14 0 0 232 124" fill="none" stroke="#39e6ff" stroke-width="4" opacity="0.9" transform="rotate(0)"/>
</svg>
